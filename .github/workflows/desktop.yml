name: App per computer (Mac e Windows)

# Costruisce l'app Hitframe per Mac e Windows e la pubblica nella pagina Releases del repository.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_GOOGLE_DESKTOP_SECRET: ${{ secrets.HF_GOOGLE_DESKTOP_SECRET }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: 'Hitframe __VERSION__ per computer'
          releaseBody: |
            **Mac**: scarica il file `.dmg`, aprilo e trascina Hitframe in Applicazioni.
            La prima volta macOS potrebbe bloccarla: Impostazioni di Sistema → Privacy e sicurezza → "Apri comunque".

            **Windows**: scarica il file `-setup.exe` e avvialo. Se compare "Windows ha protetto il PC": Ulteriori informazioni → Esegui comunque.

            I dati si sincronizzano con il telefono tramite il tuo Google Drive.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
